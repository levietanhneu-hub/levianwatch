<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Levian Watch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Roboto:wght@500;700&display=swap">
<style>
/* Layout: thanh đầu dính (tên shop + liên hệ) → lọc → lưới thẻ ảnh 4:5; chạm thẻ mở bảng chi tiết (toàn màn hình trên điện thoại) */
:root{
  --bg:#f5f3f2; --surface:#ffffff; --sunk:#ebe7e5; --line:#e0d9d6;
  --ink:#16110f; --mute:#6a605c; --mint:#0c0a0a; --hdr-ink:#ffffff; --hdr-mute:#b9aeaa; --deep:#c5221a; --deep-ink:#ffffff; --price:#a81d16;
  --f-display:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0a0a; --surface:#161313; --sunk:#1f1b1a; --line:#2f2826;
  --ink:#f3eeec; --mute:#a99f9b; --mint:#000000; --hdr-ink:#ffffff; --hdr-mute:#a99f9b; --deep:#ff4a3d; --deep-ink:#ffffff; --price:#ff6b5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0a0a; --surface:#161313; --sunk:#1f1b1a; --line:#2f2826;
  --ink:#f3eeec; --mute:#a99f9b; --mint:#000000; --hdr-ink:#ffffff; --hdr-mute:#a99f9b; --deep:#ff4a3d; --deep-ink:#ffffff; --price:#ff6b5e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--mint)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}

/* banner: mặt tiền đèn neon đỏ dạng nan dọc (theo ảnh fanpage) + logo Levian */
.banner{position:relative;overflow:hidden;background:#050404;height:clamp(150px,30vw,230px);border-bottom:6px solid #111;box-shadow:inset 0 6px 0 #161616}
.banner .slats,.banner .glow{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,#ff3a2a 9px 12px,transparent 12px 20px)}
.banner .glow{filter:blur(6px);opacity:1}
.banner .slats{background:repeating-linear-gradient(90deg,transparent 0 10px,#ffb3a8 10px 11px,transparent 11px 20px),repeating-linear-gradient(90deg,transparent 0 9px,#f0180c 9px 12px,transparent 12px 20px)}
.banner .shade{position:absolute;inset:0;background:radial-gradient(ellipse 30% 58% at 50% 50%,rgba(0,0,0,.6),rgba(0,0,0,.2) 70%,transparent),linear-gradient(180deg,rgba(0,0,0,.45),transparent 22%,transparent 78%,rgba(0,0,0,.55))}
.banner img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:80%;width:auto;filter:drop-shadow(0 0 6px rgba(0,0,0,.9)) drop-shadow(0 0 14px rgba(255,255,255,.25))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--mint);color:var(--hdr-ink);border-bottom:2px solid var(--deep)}
header .sub{color:var(--hdr-mute)!important}
header .btn{background:transparent;color:var(--hdr-ink);border-color:rgba(255,255,255,.28)}
header .btn.pri{background:var(--deep);border-color:var(--deep);color:#fff}
.hd .mk{display:flex;align-items:center;gap:10px;min-width:0}
.hd .mk img{height:34px;width:auto;flex:none}
.hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:12px}
.hd h1{font:700 21px/1.15 var(--f-display);margin:0;letter-spacing:-.2px;text-wrap:balance}
.hd .sub{font-size:12.5px;color:var(--mute)}
.contact{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 13px;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--deep);color:var(--deep-ink);border-color:var(--deep)}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;margin-top:8px;align-items:center}
.filters select{min-width:0;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.filters select.on{border-color:var(--deep);color:var(--deep);font-weight:600}
.filters .clr{background:none;border:0;color:var(--deep);font-weight:600;font-size:14px;padding:6px 4px;white-space:nowrap}
@media (max-width:640px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters .clr{grid-column:1/-1;justify-self:start}}
.sort{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;flex:0 0 auto}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:14px 4px}
.search{flex:1 1 220px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:4px 2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--deep);color:var(--deep-ink);border-color:var(--deep)}
.chip .n{opacity:.7;margin-left:4px}

main{padding-block:10px 48px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{display:flex;flex-direction:column;align-items:stretch;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;padding:0;transition:transform .15s,border-color .15s}
.card:hover{border-color:var(--mute);transform:translateY(-2px)}
.ph{position:relative;flex:none;width:100%;aspect-ratio:4/5;max-width:100%;background:var(--sunk);display:grid;place-items:center;color:var(--mute);font-size:13px}
.ph{overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.st{position:absolute;left:8px;top:8px;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;background:#d9f2dc;color:#1d5b2a}
.st.ve{background:#ffe0c2;color:#8a4210}
.cnt{position:absolute;right:8px;bottom:8px;font-size:11.5px;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:1px 8px}
.ci{display:grid;gap:2px;padding:10px 12px 12px;min-width:0}
.eb{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);font-weight:600}
.nm{font:600 15px/1.3 var(--f-body);text-wrap:balance}
.meta{font-size:12.5px;color:var(--mute);display:grid;gap:1px;margin-top:2px}
.meta .li{display:block;position:relative;padding-left:12px;overflow-wrap:anywhere}
.meta .li::before{content:"–";position:absolute;left:0}
.pr{font:700 17px/1.3 var(--f-display);color:var(--price);margin-top:4px}
@media (max-width:520px){.card .pr{font-size:15px;white-space:nowrap}}
.empty{text-align:center;color:var(--mute);padding:48px 12px}
footer{border-top:1px solid var(--line);padding-block:20px 32px;color:var(--mute);font-size:13px;display:grid;gap:4px}

/* chi tiết */
.scrim{position:fixed;inset:0;background:rgba(6,14,11,.5);z-index:20}
/* bảng chi tiết: cửa sổ giữa màn hình, 70% chiều rộng và chiều cao, cuộn bên trong */
.sheet{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(min(340px,calc(100vw - 24px)),70vw,100vw);height:70vh;max-height:calc(100vh - 24px);background:var(--bg);overflow-y:auto;overscroll-behavior:contain;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.shd{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;background:var(--mint);border-bottom:1px solid var(--line);padding-block:10px}
.shd{color:var(--hdr-ink)} .shd .x{color:var(--hdr-mute)}
.shd h2{margin:0;font:700 17px/1.2 var(--f-display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.x{background:none;border:0;font-size:28px;line-height:1;color:var(--mute);padding:0 4px}
/* ảnh chi tiết: rộng gấp đôi ảnh thẻ ngoài trang chủ (--gw do JS đặt), căn giữa, vuốt ngang */
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--sunk);padding:12px max(12px,calc((100% - var(--gw,360px))/2))}
.gal img{flex:0 0 min(var(--gw,360px),100%);width:min(var(--gw,360px),100%);aspect-ratio:4/5;object-fit:cover;scroll-snap-align:center;cursor:zoom-in;border-radius:8px;display:block}
.gwrap{position:relative}
.gwrap .ga{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:99px;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:26px;line-height:38px;padding:0;z-index:1}
.gwrap .ga:hover{background:rgba(0,0,0,.72)}
.gwrap .gp{left:8px}.gwrap .gn{right:8px}
@media (max-width:899px){.sheet{height:calc(100vh - 32px);height:calc(100dvh - 32px)}}
@media (min-width:900px){.sheet{height:auto;min-height:70vh;max-height:calc(100vh - 32px)}.sbody{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start}.gcol{width:calc(var(--gw,360px) + 24px);background:var(--sunk);align-self:stretch}.sb{padding-top:16px}}
.gnav{display:flex;justify-content:center;gap:6px;padding:8px 0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);border:0;padding:0}
.dot[aria-current="true"]{background:var(--deep)}
.sb{display:grid;gap:14px;padding-block:6px 28px}
.sb .pr{font-size:24px;margin:0}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:14px}
dt{color:var(--mute)} dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.mota{white-space:pre-wrap;margin:0}
.act{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.cpw{display:inline-grid;gap:4px;justify-items:center}
.hint{font-size:12.5px;color:var(--mute);margin:0}
.phone{user-select:all;font-weight:600}

#lb{position:fixed;inset:0;z-index:40;background:rgba(5,8,7,.95);display:flex;align-items:center;justify-content:center}
#lb img{max-width:100vw;max-height:100vh;object-fit:contain}
#lb button{position:absolute;border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:99px;width:44px;height:44px;font-size:26px;line-height:44px;padding:0}
#lb .lx{top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px))}
#lb .lp{left:calc(10px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%)}
#lb .ln{right:calc(10px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%)}
#lb .lc{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(0,0,0,.45);border-radius:99px;padding:2px 10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:10px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

  render();});
$("q").addEventListener("input",function(){F.q=this.value.trim().toLowerCase();grid();});
$("sort").addEventListener("change",function(){F.sort=this.value;grid();});
$("grid").addEventListener("click",function(e){var b=e.target.closest(".card");if(b) location.hash="m-"+b.dataset.k;});

var MSGR="https://m.me/leviantiti"; // nhắn tới facebook.com/leviantiti
function msg(w){return "Chào shop, mình quan tâm mẫu "+w.model+(w.ref?" (Ref "+w.ref+")":"")+(w.gia?", giá "+w.gia:"")+". Shop gửi thêm ảnh/video giúp mình nhé.";}
function info(w){
  var L=[w.model];
  [["Ref",w.ref],["Size",w.sz],["Tình trạng",w.tt],["Phụ kiện",w.pk],["Ngày ghi trên thẻ BH",w.the],["Hàng",stLabel(w)],["Giá",w.giaFull||w.gia||"Liên hệ"]].forEach(function(r){if(r[1]) L.push("- "+r[0]+": "+r[1]);});
  if(w.mota) L.push(w.mota);
  return L.join("\n");
}
function openSheet(w){
  var g=w.imgs.length?'<div class="gwrap"><div class="gal" id="gal">'+w.imgs.map(function(u,i){return '<img src="'+esc(u)+'" alt="'+esc(w.model)+' ảnh '+(i+1)+'" data-i="'+i+'"'+(i?' loading="lazy"':"")+'>';}).join("")+'</div>'+
    (w.imgs.length>1?'<button type="button" class="ga gp" id="gPrev" aria-label="Ảnh trước">‹</button><button type="button" class="ga gn" id="gNext" aria-label="Ảnh sau">›</button>':"")+'</div>'+
    (w.imgs.length>1?'<div class="gnav" id="gnav">'+w.imgs.map(function(_,i){return '<button class="dot" type="button" data-i="'+i+'" aria-label="Ảnh '+(i+1)+'"'+(i?"":' aria-current="true"')+'></button>';}).join("")+'</div>':"")
    :'<div class="ph" style="aspect-ratio:16/9">Ảnh đang cập nhật</div>';
  var rows=[["Ref",w.ref],["Size",w.sz],["Tình trạng",w.tt],["Phụ kiện",w.pk],["Ngày ghi trên thẻ BH",w.the],["Hàng",stLabel(w)]].filter(function(r){return r[1];});
  $("sheet").innerHTML='<div class="shd gut"><button class="x" type="button" data-x aria-label="Đóng">×</button><h2>'+esc(w.model)+'</h2></div><div class="sbody"><div class="gcol">'+g+'</div>'+
    '<div class="sb gut"><div><div class="eb">'+esc(w.brand)+'</div><div class="pr">'+esc(w.giaFull||w.gia||"Liên hệ")+'</div></div>'+
    '<dl>'+rows.map(function(r){return "<dt>"+esc(r[0])+"</dt><dd>"+esc(r[1])+"</dd>";}).join("")+'</dl>'+
    (w.mota?'<p class="mota">'+esc(w.mota)+'</p>':"")+
    '<div class="act"><a class="btn pri" id="askZ" href="'+esc(MSGR+"?text="+encodeURIComponent(msg(w)))+'" target="_blank" rel="noopener">Hỏi mẫu này qua Messenger</a>'+
    '<span class="cpw"><button class="btn" type="button" id="askC">Sao chép thông tin đồng hồ</button><span class="hint">(để nhắn tin cho shop)</span></span></div></div></div>';
  $("sheet").hidden=false;$("scrim").hidden=false;$("sheet").scrollTop=0;
  // điện thoại: ảnh = gấp đôi ảnh thẻ ngoài trang chủ; máy tính (2 cột): cột ảnh chiếm 50% chiều rộng cửa sổ, ảnh giữ tỷ lệ 4:5
  var c0=document.querySelector("#grid .ph"), gw=c0&&c0.offsetWidth?Math.round(c0.offsetWidth*2):360, sh=$("sheet");
  if(matchMedia("(min-width:900px)").matches) gw=Math.floor(sh.clientWidth*0.5)-24;
  sh.style.setProperty("--gw",Math.max(200,gw)+"px");
  if($("askZ")) $("askZ").addEventListener("click",function(){copy(msg(w),"Đã sao chép tin nhắn — dán vào Messenger nếu khung chat còn trống");});
  $("askC").onclick=function(){copy(info(w),"Đã sao chép thông tin đồng hồ");};
  var gal=$("gal");
  if(gal){
    gal.addEventListener("click",function(e){var im=e.target.closest("img");if(im) lbOpen(w.imgs,+im.dataset.i);});
    if($("gPrev")){
      var gGo=function(d){var n=w.imgs.length,i=Math.round(gal.scrollLeft/galStep(gal));i=(i+d+n)%n;gal.scrollTo({left:i*galStep(gal),behavior:"smooth"});};
      $("gPrev").onclick=function(){gGo(-1);};$("gNext").onclick=function(){gGo(1);};
    }
    if($("gnav")){
      gal.addEventListener("scroll",function(){var i=Math.round(gal.scrollLeft/galStep(gal));$("gnav").querySelectorAll(".dot").forEach(function(d,k){d.setAttribute("aria-current",String(k===i));});},{passive:true});
      $("gnav").addEventListener("click",function(e){var d=e.target.closest(".dot");if(d) gal.scrollTo({left:+d.dataset.i*galStep(gal),behavior:"smooth"});});
    }
  }
}
function galStep(g){var im=g.querySelector("img");return im?im.offsetWidth+8:g.clientWidth;}
function closeSheet(){$("sheet").hidden=true;$("scrim").hidden=true;}
function route(){
  var m=/^#m-([0-9a-f]{7})$/.exec(location.hash), w=m&&I.filter(function(x){return x.k===m[1];})[0];
  if(w) openSheet(w); else closeSheet();
}
function goHome(){if(location.hash) location.hash="list"; closeSheet();}
$("sheet").addEventListener("click",function(e){if(e.target.closest("[data-x]")) goHome();});
$("scrim").onclick=goHome;
window.addEventListener("hashchange",route);

function lbShow(){var n=LB.u.length;$("lb").querySelector("img").src=LB.u[LB.i];$("lb").querySelector(".lc").textContent=(LB.i+1)+" / "+n;$("lb").querySelector(".lp").hidden=n<2;$("lb").querySelector(".ln").hidden=n<2;}
function lbOpen(u,i){LB.u=u;LB.i=i||0;lbShow();$("lb").hidden=false;}
function lbClose(){$("lb").hidden=true;}
function lbStep(d){var n=LB.u.length;if(n<2) return;LB.i=(LB.i+d+n)%n;lbShow();}
$("lb").addEventListener("click",function(e){if(e.target.closest(".lx")) return lbClose();if(e.target.closest(".lp")) return lbStep(-1);if(e.target.closest(".ln")) return lbStep(1);if(e.target===this) lbClose();});
$("lb").addEventListener("touchstart",function(e){if(e.touches.length===1) LB.x=e.touches[0].clientX;},{passive:true});
$("lb").addEventListener("touchend",function(e){if(LB.x==null) return;var dx=e.changedTouches[0].clientX-LB.x;LB.x=null;if(Math.abs(dx)>45) lbStep(dx<0?1:-1);},{passive:true});
document.addEventListener("keydown",function(e){
  if(!$("lb").hidden){if(e.key==="Escape") lbClose();else if(e.key==="ArrowLeft") lbStep(-1);else if(e.key==="ArrowRight") lbStep(1);return;}
  if(e.key==="Escape"&&!$("sheet").hidden) goHome();
});
render();route();
})();
</script>

</body></html>
